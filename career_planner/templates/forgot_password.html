<!DOCTYPE html>
<html>
  <head>
    <title>Forgot Password - Career Planner</title>
    <style>
      .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-family: Arial, sans-serif;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="email"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      button {
        padding: 10px 15px;
        background-color: #007bff;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 3px;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
      a {
        display: inline-block;
        margin-top: 15px;
        color: #007bff;
        text-decoration: none;
        font-size: 14px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Reset Password</h2>
      <form method="POST">
        <div class="form-group">
          <label for="email">Enter your registered email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <button type="submit">Send OTP</button>
      </form>
      <a href="{{ url_for('login') }}">Back to Login</a>
    </div>
  </body>
</html>
