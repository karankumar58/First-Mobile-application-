<!DOCTYPE html>
<html>
  <head>
    <title>Login - Career Planner</title>
    <style>
      body {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-container {
        background: white;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h2 {
        color: #2c3e50;
        font-size: 2rem;
        margin-bottom: 30px;
        font-weight: 700;
      }
      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #2c3e50;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }
      button {
        width: 100%;
        padding: 14px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }
      button:hover {
        background-color: #27ae60;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
      }
      .forgot-password {
        display: block;
        margin-top: 15px;
        color: #3498db;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .forgot-password:hover {
        text-decoration: underline;
      }
      .register-link {
        margin-top: 25px;
        color: #7f8c8d;
        font-size: 0.9rem;
      }
      .register-link a {
        color: #3498db;
        text-decoration: none;
        font-weight: 600;
      }
      .register-link a:hover {
        text-decoration: underline;
      }
      .error-message {
        color: #e74c3c;
        margin-bottom: 20px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login to Your Account</h2>

      <!-- Error message placeholder (you can dynamically insert this) -->
      <!-- <div class="error-message">Invalid email or password</div> -->

      <form method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>

        <a href="{{ url_for('forgot_password') }}" class="forgot-password"
          >Forgot Password?</a
        >

        <button type="submit">Login</button>
      </form>

      <div class="register-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
      </div>
    </div>
  </body>
</html>
